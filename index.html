<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioPharma - E-Pharmacy Portal</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Sticky Header & Navigation Bar -->
    <header>
        <div class="navbar">
            <div class="nav-brand" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-file-waveform"></i> BioPharma
            </div>
            
            <ul class="nav-links" id="nav-links" style="display: none;">
                <li><a class="nav-item active" id="nav-catalog" href="index.html">Catalog</a></li>
                <li><a class="nav-item" id="nav-prescription" href="prescription.html">Upload Prescription</a></li>
                <li id="admin-nav-item" style="display: none;"><a class="nav-item" id="nav-admin" href="admin.html">Admin Panel</a></li>
            </ul>

            <div class="nav-actions" id="nav-actions" style="display: none;">
                <div class="cart-badge-container" onclick="window.location.href='cart.html'">
                    <button class="cart-icon-btn">
                        <i class="fa-solid fa-shopping-cart"></i>
                    </button>
                    <span class="cart-count" id="cart-count">0</span>
                </div>
                
                <div class="user-profile-badge">
                    <i class="fa-solid fa-user-circle"></i>
                    <span id="user-display-name">User</span>
                    <span class="user-role-tag role-user" id="user-display-role">USER</span>
                </div>

                <button class="btn btn-danger" onclick="handleLogout()">
                    <i class="fa-solid fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Views Container -->
    <main>
        <!-- Medicine Directory View (Default index.html view) -->
        <section id="catalog-view" class="view-section active">
            <div class="catalog-header">
                <div>
                    <h2>Prescription & OTC Medicines</h2>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Browse products and stock availability</p>
                </div>
                <div class="search-box">
                    <i class="fa-solid fa-search search-icon"></i>
                    <input type="text" id="search-input" class="form-control search-input" placeholder="Search medicines or brands..." oninput="filterMedicines()">
                </div>
            </div>
            
            <!-- Dynamic Grid listing medicines -->
            <div class="meds-grid" id="meds-grid">
                <!-- Loaded dynamically by JS -->
            </div>
        </section>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <footer>
        <p>&copy; 2026 BioPharma. Built with pure Java & Web standards.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
